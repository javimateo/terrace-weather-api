spring.application.name=terrace-weather-api
terrace.weather.open-meteo.base-url=https://api.open-meteo.com
terrace.weather.cache-ttl=15m
terrace.rate-limit.requests-per-minute=60
management.endpoints.web.exposure.include=health,info
# API messages must not change with the server's language
spring.web.locale=en
spring.web.locale-resolver=fixed
# Same JSON error shape (RFC 9457 problem+json) for validation errors as for our own 4xx/5xx
spring.mvc.problemdetails.enabled=true
# Behind Coolify's reverse proxy: trust X-Forwarded-* (real client IP for rate limiting, https in Swagger)
server.forward-headers-strategy=native
server.shutdown=graceful
# Umami (self-hosted, cookie-less visit counter) injected into Swagger UI; see UmamiFilter.
umami.src=${UMAMI_SRC:}
umami.id=${UMAMI_ID:}
